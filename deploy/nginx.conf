# /etc/nginx/sites-available/edilpregio.conf
# Configurazione Nginx per IONOS Linux VPS

# Reindirizzamento automatico HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tua-impresa-edile.it www.tua-impresa-edile.it;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server HTTPS Principale
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tua-impresa-edile.it www.tua-impresa-edile.it;

    # Certificati SSL (Let's Encrypt / Certbot o certificati IONOS)
    ssl_certificate /etc/letsencrypt/live/tua-impresa-edile.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tua-impresa-edile.it/privkey.pem;

    # Parametri SSL moderni e sicuri
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Limite upload per fotografie cantieri in alta risoluzione
    client_max_body_size 50M;

    # Compressione Gzip per massime prestazioni
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Directory dei file statici compilati del Frontend React (Vite)
    root /var/www/edilizia/frontend/dist;
    index index.html;

    # 1. Routing per Frontend SPA (React Router / Vite)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Cache aggressiva per asset statici con hash (JS, CSS, Immagini locali)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # 2. Reverse Proxy per API Express Backend (in ascolto locale su porta 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout per upload di foto pesanti
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # 3. Servizio Diretto Immagini Uploadate (/uploads/*) per prestazioni ottimali senza impegnare Node.js
    location /uploads/ {
        alias /var/www/edilizia/backend/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Sicurezza: blocca accesso a file nascosti o file sensibili (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
