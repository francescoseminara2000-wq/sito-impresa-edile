# /etc/nginx/sites-available/bmg-costruzioni.conf
# Configurazione Nginx per IONOS VPS - BMG Costruzioni

server {
    listen 80;
    listen [::]:80;
    server_name bmg-costruzioni.it www.bmg-costruzioni.it;

    client_max_body_size 50M;

    # Compressione per massime prestazioni
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Frontend React compilato
    root /var/www/edilizia/frontend/dist;
    index index.html;

    # Routing SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy verso Backend Node.js bmg-costruzioni (porta 3002)
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Uploads Immagini WebP servite direttamente da Nginx
    location /uploads/ {
        alias /var/www/edilizia/backend/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
}
